{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<section class="narrow auth">
  <h1>Log in</h1>
  <form method="post" class="form" data-validate novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Email
      <input type="email" name="email" value="{{ form.get('email', '') }}" data-required data-email autocomplete="email">
    </label>
    <label>Password
      <input type="password" name="password" data-required autocomplete="current-password">
    </label>
    <button class="btn" type="submit">Log in</button>
  </form>
  <p>No account? <a href="{{ url_for('auth.register') }}">Register</a></p>
  <p class="muted small">Demo account: demo@booknest.com / Demo@1234</p>
</section>
{% endblock %}
