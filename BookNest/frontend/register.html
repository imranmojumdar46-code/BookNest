{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<section class="narrow auth">
  <h1>Create an account</h1>
  <form method="post" class="form" data-validate novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Full name
      <input type="text" name="name" value="{{ form.get('name', '') }}" data-required data-min="2" maxlength="80" autocomplete="name">
    </label>
    <label>Email
      <input type="email" name="email" value="{{ form.get('email', '') }}" data-required data-email maxlength="120" autocomplete="email">
    </label>
    <label>Password
      <input type="password" name="password" id="password" data-required data-password autocomplete="new-password">
      <small class="hint">At least 8 characters with a letter and a number.</small>
      <span class="strength" id="strength"></span>
    </label>
    <label>Confirm password
      <input type="password" name="confirm" data-required data-match="password" autocomplete="new-password">
    </label>
    <button class="btn" type="submit">Register</button>
  </form>
  <p>Already a member? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</section>
{% endblock %}
